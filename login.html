<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Red Integrada de Salud Celendín</title>

    <!-- Favicon -->
    <link rel="icon" href="Imagenes/logo-png.png" type="image/x-icon">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
    /* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f5f8fc;
    color: #1e293b;
}


/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #0f4c81, #16a34a);

    color: white;

    padding: 12px 6%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.15);

    position: sticky;

    top: 0;

    z-index: 1000;
}


/* =========================
   LOGO + TÍTULO
========================= */

.logo-container {
    display: flex;

    align-items: center;

    gap: 15px;

    flex: 1;

    min-width: 0;
}


.logo-container img {
    width: 65px;

    height: auto;

    object-fit: contain;
}


.logo-container h1 {
    font-size: 1.4rem;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   MENÚ DESKTOP
========================= */

nav {
    display: flex;

    align-items: center;

    gap: 25px;
}


nav a {
    color: white;

    text-decoration: none;

    font-weight: 500;

    position: relative;

    transition: .3s;
}


nav a::after {
    content: '';

    position: absolute;

    left: 0;

    bottom: -5px;

    width: 0;

    height: 2px;

    background: white;

    transition: .3s;
}


nav a:hover::after,
nav a.activo::after {
    width: 100%;
}


/* =========================
   BOTÓN HAMBURGUESA
========================= */

.menuToggle {
    display: none;

    border: none;

    background: transparent;

    color: white;

    font-size: 2rem;

    cursor: pointer;

    padding: 5px;

    margin-left: auto;

    flex-shrink: 0;
}


/* =========================
   LOGIN
========================= */

.login-section {
    min-height: calc(100vh - 100px);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 60px 20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(22, 163, 74, 0.08),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(15, 76, 129, 0.08),
            transparent 35%
        );
}


/* =========================
   TARJETA LOGIN
========================= */

.login-card {
    background: white;

    width: 100%;

    max-width: 450px;

    border-radius: 30px;

    padding: 50px 40px;

    box-shadow:
        0 25px 60px rgba(15, 76, 129, 0.12);

    text-align: center;

    animation: fadeUp .8s ease;
}


/* =========================
   ICONO LOGIN
========================= */

.login-icon {
    width: 90px;

    height: 90px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #0f4c81,
            #16a34a
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 2.5rem;

    box-shadow:
        0 10px 30px rgba(15, 76, 129, 0.25);
}


/* =========================
   TEXTOS LOGIN
========================= */

.login-card h2 {
    color: #0f4c81;

    margin-bottom: 10px;

    font-size: 2rem;
}


.login-card > p {
    color: #64748b;

    margin-bottom: 35px;

    font-size: .95rem;
}


/* =========================
   INPUTS
========================= */

.input-group {
    position: relative;

    margin-bottom: 22px;

    text-align: left;
}


.input-group label {
    display: block;

    margin-bottom: 8px;

    font-weight: 500;

    color: #334155;
}


.input-group input {
    width: 100%;

    padding: 14px 45px 14px 15px;

    border:
        1px solid #dbe2ea;

    border-radius: 12px;

    outline: none;

    font-size: 1rem;

    transition: .3s;

    font-family: inherit;
}


.input-group input:focus {
    border-color: #0f4c81;

    box-shadow:
        0 0 0 4px rgba(15, 76, 129, 0.08);
}


/* ICONOS INPUT */

.input-group > i {
    position: absolute;

    right: 15px;

    top: 44px;

    color: #94a3b8;
}


/* OJO CONTRASEÑA */

.toggle-password {
    cursor: pointer;

    z-index: 2;
}


/* =========================
   BOTÓN LOGIN
========================= */

.btn-login {
    width: 100%;

    border: none;

    padding: 15px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #0f4c81,
            #16a34a
        );

    color: white;

    font-size: 1rem;

    font-weight: 600;

    cursor: pointer;

    transition: .3s;

    box-shadow:
        0 12px 25px rgba(15, 76, 129, 0.18);

    margin-top: 10px;
}


.btn-login:hover {
    transform: translateY(-3px);

    box-shadow:
        0 18px 35px rgba(15, 76, 129, 0.22);
}


/* =========================
   ENLACES EXTRA
========================= */

.extra-links {
    margin-top: 25px;

    font-size: .9rem;
}


.extra-links p {
    margin: 0;
}


.extra-links a {
    color: #0f4c81;

    text-decoration: none;

    font-weight: 500;
}


.extra-links a:hover {
    text-decoration: underline;
}


/* =========================
   FOOTER
========================= */

footer {
    background: #0f172a;

    color: #cbd5e1;

    text-align: center;

    padding: 25px;

    font-size: .9rem;
}


/* =========================
   ANIMACIÓN
========================= */

@keyframes fadeUp {

    from {
        opacity: 0;

        transform: translateY(40px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}


/* =========================
   TABLETS Y CELULARES
========================= */

@media (max-width: 768px) {

    /* =========================
       HEADER
    ========================= */

    header {
        height: 70px;

        padding: 8px 5%;

        display: flex;

        flex-direction: row;

        align-items: center;

        gap: 10px;
    }


    /* LOGO */

    .logo-container {
        min-width: 0;

        gap: 10px;
    }


    .logo-container img {
        width: 48px;

        height: 48px;

        object-fit: contain;
    }


    /* TÍTULO */

    .logo-container h1 {
        font-size: .95rem;

        font-weight: 600;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    /* =========================
       BOTÓN HAMBURGUESA
    ========================= */

    .menuToggle {
        display: block;

        color: white;

        font-size: 2rem;

        margin-left: auto;
    }


    /* =========================
       MENÚ MOBILE
    ========================= */

    header nav {
        position: absolute;

        top: 70px;

        left: 0;

        width: 100%;

        background: white;

        box-shadow:
            0 10px 25px rgba(0, 0, 0, .12);

        display: none;

        flex-direction: column;

        gap: 0;

        padding: 10px 0;
    }


    /* MENÚ ABIERTO */

    header nav.menuAbierto {
        display: flex;
    }


    /* ENLACES */

    header nav a {
        display: block;

        width: 100%;

        padding: 14px 20px;

        text-align: center;

        color: #0f4c81;

        font-size: .95rem;

        transition: .3s;
    }


    /* QUITAR LÍNEA INFERIOR */

    header nav a::after {
        display: none;
    }


    /* HOVER */

    header nav a:hover,
    header nav a.activo {
        background: #f0fdf4;

        color: #16a34a;
    }


    /* =========================
       LOGIN
    ========================= */

    .login-section {
        min-height: calc(100vh - 70px);

        padding: 40px 20px;
    }


    .login-card {
        max-width: 420px;

        padding: 40px 25px;

        border-radius: 25px;
    }


    .login-icon {
        width: 75px;

        height: 75px;

        font-size: 2rem;

        margin-bottom: 20px;
    }


    .login-card h2 {
        font-size: 1.7rem;
    }


    .login-card > p {
        font-size: .88rem;

        margin-bottom: 28px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        font-size: .8rem;

        padding: 20px;
    }

}


/* =========================
   CELULARES PEQUEÑOS
========================= */

@media (max-width: 480px) {

    header {
        padding: 8px 4%;
    }


    .logo-container {
        gap: 8px;
    }


    .logo-container img {
        width: 42px;

        height: 42px;
    }


    .logo-container h1 {
        font-size: .82rem;
    }


    .menuToggle {
        font-size: 1.8rem;
    }


    .login-section {
        padding: 30px 15px;
    }


    .login-card {
        padding: 35px 20px;

        border-radius: 22px;
    }


    .login-card h2 {
        font-size: 1.5rem;
    }


    .input-group input {
        padding: 13px 42px 13px 13px;

        font-size: .9rem;
    }


    .btn-login {
        padding: 14px;

        font-size: .95rem;
    }

}

    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="Imagenes/logo-png.png" alt="Logo">
            </a>
            <h1>Red Integrada de Salud Celendín</h1>
        </div>
        <button class="menuToggle" id="menuToggle">
            <i class='bx bx-menu'></i>
        </button>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="noticias.html">Noticias</a>
            <a href="cursosVida.html">Cursos de Vida</a>
            <a href="login.html" class="activo">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- LOGIN -->
    <section class="login-section">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-user-shield"></i>
            </div>

            <h2>Iniciar Sesión</h2>
            <p>Accede al panel administrativo de la Red Integrada de Salud Celendín.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="usuario@riscelendin.gob.pe" required>
                    <i class="fas fa-envelope"></i>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-right-to-bracket"></i> Iniciar Sesión
                </button>
            </form>

            <div class="extra-links">
                <p><a href="#">¿Olvidó su contraseña?</a></p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        © 2026 Red Integrada de Salud Celendín - Todos los derechos reservados.
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // Mostrar / ocultar contraseña
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Simulación de envío del formulario
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Aquí conectaremos el inicio de sesión con Firebase Authentication.');
        });
    </script>
    <script>

        const menuToggle =
            document.getElementById('menuToggle');

        const nav =
            document.querySelector('header nav');

        menuToggle.addEventListener('click', function () {

            nav.classList.toggle('menuAbierto');

        });

    </script>
</body>

</html>
